<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#079b87">
<title>My RG-UG</title>


<style>
*{box-sizing:border-box}
:root{--green:#079b87;--green2:#0bb59e;--dark:#087d6d;--soft:#e9faf6;--ink:#27332f;--muted:#71807b}
body{margin:0;background:#f4f7f6;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.wrap{width:100%;max-width:780px;margin:0 auto;padding:18px 20px}
.card{background:#fff;border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 3px 14px #17483a0d}
.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--green);color:#fff;font-weight:700}
.btn.alt{background:#e8f3f0;color:#087d6d}.btn.danger{background:#b42318}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
input,textarea,select{width:100%;padding:12px;border:1px solid #d9e4e0;border-radius:11px;margin:5px 0 10px;background:#fff}
textarea{min-height:90px;resize:vertical}.muted{color:var(--muted);font-size:13px}
.error{color:#b42318;font-size:13px;margin-bottom:8px}.stat{font-size:24px;font-weight:800}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e5e9e6;text-align:left;font-size:13px}

/* Header (semua elemen rata tengah) */
.app-top{color:#fff;overflow:hidden;background:linear-gradient(145deg,#079b87,#10b79f)}
.pattern{position:relative;padding:24px 20px 28px;display:flex;flex-direction:column;align-items:center;text-align:center}
.pattern:before{content:"";position:absolute;inset:-30px;opacity:.13;background-image:radial-gradient(circle at 20% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 75% 65%,#fff 0 2px,transparent 3px);background-size:45px 45px,62px 62px;transform:rotate(-8deg);pointer-events:none}
.pattern>*{position:relative}
.rolepill{background:#ffffff25;border:1px solid #ffffff55;border-radius:999px;padding:8px 14px;font-size:12px}
.top-login{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:999px;width:38px;height:38px;padding:0;display:grid;place-items:center}
.top-login svg{width:18px;height:18px}
.hero{padding-top:16px;width:100%;max-width:340px}
.hero-title{font-size:26px;font-weight:800;line-height:1.2;margin:0 0 6px}
.hero-sub{font-size:13px;line-height:1.45;opacity:.92;margin:0;text-wrap:balance}
.access{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px}
.home-body{padding-top:14px}.qicon svg{width:23px;height:23px}.section-title{font-size:16px;font-weight:800;margin:16px 2px 10px}
.banner{background:linear-gradient(135deg,#dffbf3,#effffb);border:1px solid #bcefe3;border-radius:16px;padding:15px;margin:14px 0}
.banner b{color:#087d6d;font-size:17px}.banner small{display:block;color:#528078;margin-top:3px}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.quick{border:0;background:transparent;text-align:center;color:#46534e;padding:5px 2px;min-width:0}
.qicon{width:52px;height:52px;border-radius:50%;background:#e5f8f3;margin:0 auto 7px;display:grid;place-items:center;color:#087d6d;box-shadow:inset 0 0 0 1px #d6f1ea;transition:.2s}
.quick b{display:block;font-size:12px;font-weight:600;line-height:1.25}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.info-card{border:0;text-align:left;background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 13px #17483a0b;min-height:106px}
.info-icon{width:34px;height:34px;border-radius:10px;background:#e9f8f4;color:#087d6d;display:grid;place-items:center;margin-bottom:8px}.info-icon svg{width:19px;height:19px}.info-card b{font-size:14px}.info-card small{display:block;color:var(--muted);margin-top:4px}
.media-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.media-card{background:#f7faf9;border:1px solid #e2ebe7;border-radius:14px;overflow:hidden}
.media-card img,.media-card video{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#dfe9e5}
.media-meta{padding:9px}.media-meta b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media-meta small{display:block;color:var(--muted);margin-top:3px}
.filebox{border:1.5px dashed #9dd9cd;background:#f0fbf8;border-radius:14px;padding:14px;margin:10px 0}
.filebox input{border:0;background:transparent;padding:4px 0;margin:4px 0}
.login{max-width:430px;margin:9vh auto}.page-card{position:relative}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding-right:0}.page-head h2{margin:0;font-size:21px}.inline-icon{display:inline-grid;vertical-align:-4px;margin-right:4px;color:#087d6d}.back-btn{flex:0 0 auto;border:1px solid #cfe6df;background:#eef8f5;color:#087d6d;border-radius:10px;padding:8px 11px;font-weight:700;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(23,72,58,.06)}.back-btn svg{width:17px;height:17px}
@media(max-width:370px){.wrap{padding-left:14px;padding-right:14px}.quick-grid{gap:8px}.qicon{width:46px;height:46px}.quick b{font-size:11px}.info-grid{gap:8px}}


/* Logo My RGUG: kartu putih rounded di tengah header */
.logoIsland{
  width:128px;
  border-radius:26px;
  background:#fff;
  padding:10px 14px;
  box-shadow:0 4px 14px rgba(0,0,0,.14);
  flex:0 0 auto;
  overflow:hidden;
}
.logoIsland img{
  width:100%;
  height:auto;
  display:block;
}

.item{background:#f8fbfa;border:1px solid #e4ece9;border-radius:13px;padding:12px;margin:9px 0;position:relative;overflow:hidden}.item b{font-size:14px}.item .muted{display:block;margin-top:4px}.notice{background:#fff8e7;border:1px solid #f4dfaa;border-radius:13px;padding:12px;margin:10px 0}.notice b{color:#8a5a00}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e7f6f2;color:#087d6d;font-size:11px;font-weight:700}.empty{padding:18px 8px;text-align:center;color:var(--muted)}
@media(max-width:430px){.wrap{padding:16px 18px}.logoIsland{width:118px}.rolepill{padding:6px 9px}.hero-title{font-size:24px}.quick-grid{gap:10px}.qicon{width:50px;height:50px}}


/* Tombol hapus jadwal */
.btn.danger{
  position:relative;
  z-index:20;
  pointer-events:auto !important;
  touch-action:manipulation;
  -webkit-tap-highlight-color:rgba(180,35,24,.18);
  cursor:pointer;
}

</style>
</head>

<script type="module">
  /* ============ KONFIGURASI FIREBASE ============
     1) Tempel "Database URL" dari Firebase Console -> Realtime Database (tab Data, di bagian atas).
        Contoh: https://my-rg-ug-f1c1e-default-rtdb.asia-southeast1.firebasedatabase.app
     2) Kalau kamu membuat project Firebase baru, ganti juga isi firebaseConfig di bawah. */
  const DATABASE_URL = "https://my-rg-ug-f1c1e-default-rtdb.asia-southeast1.firebasedatabase.app/";

  // Firebase dimuat secara aman: kalau gagal (offline / dibuka dari WhatsApp), aplikasi tetap tampil (mode baca lokal).
  (async () => {
    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js");
      const dbm = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js");
      const am  = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js");
      const firebaseConfig = {
        apiKey: "AIzaSyC7AxURodqbeP3J5e3A_cWleSUUan_M_4w",
        authDomain: "my-rg-ug-f1c1e.firebaseapp.com",
        projectId: "my-rg-ug-f1c1e",
        storageBucket: "my-rg-ug-f1c1e.firebasestorage.app",
        messagingSenderId: "868011926344",
        appId: "1:868011926344:web:5fdead5c8df6cb2eed497d",
        measurementId: "G-6XPTFKSMQC"
      };
      if (DATABASE_URL.startsWith("https://")) firebaseConfig.databaseURL = DATABASE_URL;
      const app = initializeApp(firebaseConfig);
      window.firebaseApp = app;
      window.fb = {
        db: dbm.getDatabase(app), auth: am.getAuth(app),
        ref: dbm.ref, onValue: dbm.onValue, set: dbm.set, get: dbm.get,
        signIn: am.signInWithEmailAndPassword, signOut: am.signOut, onAuthStateChanged: am.onAuthStateChanged
      };
      window.dispatchEvent(new Event("fb-ready"));
      try {
        const { getAnalytics, isSupported } = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js");
        if (await isSupported()) getAnalytics(app);
      } catch (e) { console.warn("Analytics tidak aktif:", e); }
    } catch (e) {
      console.warn("Firebase tidak aktif:", e);
    }
  })();
</script>
<div id="login" class="wrap login hidden">
 <div class="card">
  <div id="loginIconBox" style="width:42px;height:42px;border-radius:13px;background:#e9f8f4;color:#087d6d;display:grid;place-items:center;margin-bottom:10px"></div>
  <h1 style="margin:0 0 5px">Login Pengurus</h1>
  <p class="muted">Untuk Admin dan Pengurus RG-UG</p>

  <button class="btn alt" style="width:100%;margin-top:8px" onclick="cancelLogin()">Kembali</button>

 </div>

/* Login memakai Firebase Authentication. Username tanpa "@" otomatis diberi domain di bawah,
   misalnya "bendahara" -> bendahara@rgug.app. Bisa juga mengetik email lengkap. */
const EMAIL_DOMAIN="@rgug.app";

try{ data=JSON.parse(localStorage.getItem("my_rg_ug")||"{}"); }catch(e){ console.warn("Data lokal tidak terbaca, dimulai dari kosong.",e); data={}; }
data = data && typeof data==="object" && !Array.isArray(data) ? data : {};
data.jadwal = Array.isArray(data.jadwal) ? data.jadwal : [];
data.dok = Array.isArray(data.dok) ? data.dok : [];
data.keuangan = Array.isArray(data.keuangan) ? data.keuangan.filter(x=>x && Number.isFinite(Number(x.nominal))) : [];
data.informasi = data.informasi && typeof data.informasi==="object" && !Array.isArray(data.informasi) ? data.informasi : {};
["ilan","tarbiyyah","dakwah","tanmiyah"].forEach(k=>{if(!Array.isArray(data.informasi[k]))data.informasi[k]=[]});
data.administrasi = Array.isArray(data.administrasi) ? data.administrasi : [];

const DB_NAME="MyRGUGMediaDB",DB_VERSION=1,STORE="media";

function save(){
 try{ localStorage.setItem("my_rg_ug",JSON.stringify(data)); }
 catch(e){ console.warn("Cache lokal gagal disimpan:",e); if(!window.fb) alert("Data gagal disimpan. Penyimpanan browser mungkin penuh atau diblokir."); }
 pushRemote();
}

/* ===== Sinkronisasi realtime (Firebase Realtime Database) ===== */
const RT_KEYS=["jadwal","keuangan","administrasi","informasi/ilan","informasi/tarbiyyah","informasi/dakwah","informasi/tanmiyah"];
const remoteJson={};   /* JSON terakhir yang diketahui ada di server, per koleksi */
function getCol(k){ return k.startsWith("informasi/") ? data.informasi[k.slice(10)] : data[k]; }
function setCol(k,arr){ if(k.startsWith("informasi/")) data.informasi[k.slice(10)]=arr; else data[k]=arr; }
function toArr(v){ if(!v) return []; return (Array.isArray(v)?v:Object.values(v)).filter(x=>x&&typeof x==="object"); }
function pushRemote(){
 const fb=window.fb; if(!fb||!fb.db) return;
 RT_KEYS.forEach(k=>{
  if(!(k in remoteJson)) return;            /* belum sempat memuat data server, jangan menimpa */
  const arr=getCol(k)||[], j=JSON.stringify(arr);
  if(remoteJson[k]===j) return;             /* tidak ada perubahan di koleksi ini */
  const prev=remoteJson[k];
  remoteJson[k]=j;
  fb.set(fb.ref(fb.db,"data/"+k), arr.length?JSON.parse(j):null).catch(e=>{
   console.error("Gagal simpan ke server:",k,e);
   remoteJson[k]=prev;
   alert("Data gagal disimpan ke server. Pastikan sudah login dan koneksi internet aktif.");
  });
 });
}
let pendingRender=false;
function isTyping(){
 const a=document.activeElement, c=document.getElementById("content");
 return !!(a && c && c.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function rerenderView(){
 if(isTyping()){ pendingRender=true; return; }   /* jangan hapus ketikan yang sedang berjalan */
 if(!document.getElementById("login").classList.contains("hidden")) return;
 const y=window.scrollY;
 if(viewFn) viewFn(); else refreshDashboard();
 setTimeout(()=>window.scrollTo(0,y),80);
}
function startRealtime(){
 if(window.__rtStarted) return; window.__rtStarted=true;
 const fb=window.fb;
 RT_KEYS.forEach(k=>{
  fb.onValue(fb.ref(fb.db,"data/"+k),snap=>{
   let arr=toArr(snap.val());
   if(k==="keuangan") arr=arr.filter(x=>Number.isFinite(Number(x.nominal)));
   const j=JSON.stringify(arr);
   remoteJson[k]=j;
   if(JSON.stringify(getCol(k)||[])===j) return;   /* sama dengan yang tampil, tidak perlu render ulang */
   setCol(k,arr);
   try{ localStorage.setItem("my_rg_ug",JSON.stringify(data)); }catch(e){}
   rerenderView();
  },err=>console.warn("Gagal membaca data server ("+k+"):",err));
 });
 document.addEventListener("focusout",()=>{
  if(!pendingRender) return;
  setTimeout(()=>{ if(!isTyping()){ pendingRender=false; rerenderView(); } },300);
 });
 /* Pulihkan sesi login setelah aplikasi dibuka ulang */
 fb.onAuthStateChanged(fb.auth,async user=>{
  if(!user){ if(role!=="public") setPublicUI(); return; }
  if(role!=="public"||loginBusy) return;
  try{ const r=await fetchRole(user.uid); if(r&&role==="public"&&!loginBusy) enterRole(r); }
  catch(e){ console.warn("Gagal memulihkan sesi login:",e); }
 });
}
function rupiah(n){
 return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0);
}
function openMediaDB(){
 return new Promise((resolve,reject)=>{
  if(!("indexedDB" in window)){reject(new Error("IndexedDB tidak tersedia"));return}
  const req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=()=>{
   if(!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});
  };
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
}
async function getMedia(){
 try{
  const db=await openMediaDB();
  return await new Promise((resolve,reject)=>{
   const r=db.transaction(STORE,"readonly").objectStore(STORE).getAll();
   r.onsuccess=()=>resolve(r.result||[]);
   r.onerror=()=>reject(r.error);
  });
 }catch(e){return []}
}
async function addMediaFile(file){
 const db=await openMediaDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readwrite");
  const r=tx.objectStore(STORE).add({
   name:file.name,type:file.type,size:file.size,
   date:new Date().toLocaleDateString("id-ID"),blob:file
  });
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}
async function deleteMedia(id){
 const db=await openMediaDB();
 return new Promise((resolve,reject)=>{
  const r=db.transaction(STORE,"readwrite").objectStore(STORE).delete(id);
  r.onsuccess=()=>resolve();
  r.onerror=()=>reject(r.error);
 });
}

async function fetchRole(uid){
 const snap=await window.fb.get(window.fb.ref(window.fb.db,"roles/"+uid));
 const r=snap.val();
 return (typeof r==="string" && Object.prototype.hasOwnProperty.call(bidang,r)) ? r : null;
}
async function login(){
 const err=document.getElementById("err");
 if(loginBusy) return;
 const raw=document.getElementById("user").value.toLowerCase().trim();
 const p=document.getElementById("pass").value;
 if(!raw||!p){ err.textContent="Isi username dan password."; return; }
 if(!window.fb){ err.textContent="Belum tersambung ke server. Buka lewat link hosting (bukan dari WhatsApp), lalu coba lagi."; return; }
 const name=Object.prototype.hasOwnProperty.call(userAlias,raw)?userAlias[raw]:raw;
 const email=name.includes("@")?name:name+EMAIL_DOMAIN;
 loginBusy=true; err.textContent="Memeriksa...";
 try{
  const cred=await window.fb.signIn(window.fb.auth,email,p);
  const r=await fetchRole(cred.user.uid);
  if(!r){ await window.fb.signOut(window.fb.auth); err.textContent="Akun ini belum punya peran di database (node roles)."; return; }
  enterRole(r);
 }catch(e){
  console.error(e);
  const c=String((e&&e.code)||""), m=String((e&&e.message)||"");
  if(c.includes("network")) err.textContent="Tidak ada koneksi internet.";
  else if(c.includes("PERMISSION")||/permission[_ ]denied/i.test(m)){ window.fb.signOut(window.fb.auth).catch(()=>{}); err.textContent="Peran belum bisa dibaca. Cek Rules Realtime Database."; }
  else if(c.includes("operation-not-supported")) err.textContent="Buka lewat alamat https (hosting), bukan dari file lokal.";
  else if(c.includes("too-many-requests")) err.textContent="Terlalu banyak percobaan. Tunggu sebentar lalu coba lagi.";
  else err.textContent="Username/password pengurus salah.";
 }finally{ loginBusy=false; }
}

 c.classList.remove("hidden");
 c.innerHTML=`<div class="card page-card"><div class="page-head"><h2>${t}</h2><button class="back-btn" onclick="home()" aria-label="Kembali ke Dashboard">${icon("arrowLeft")}<span>Kembali</span></button></div>${body}</div>`;
 window.scrollTo({top:0,behavior:"smooth"});
}
function canEdit(k){
 return role==="admin" || role===k;
}

function renderGeneric(k){
 const can=canEdit(k);
 const list=data.informasi[k]||[];
 title(bidang[k],`${can?`<div class="form"><h3>Tambah informasi bidang</h3>
  <input id="judul" placeholder="Judul informasi">
  <textarea id="isi" placeholder="Isi informasi"></textarea>
  <button class="btn" onclick="addInfo('${k}')">Simpan Informasi</button></div>`
  :"<p class='muted'>Mode informasi: hanya dapat melihat data.</p>"}
  <h3 style="margin-top:18px">Informasi ${bidang[k]}</h3>
  <div>${list.length?list.map((x,n)=>`<div class="item"><span class="badge">${escapeHtml(x.tanggal||"")}</span><br><b>${escapeHtml(x.judul)}</b><div>${escapeHtml(x.isi||"").replace(/\r?\n/g,"<br>")}</div>${can?`<button class="btn danger" style="margin-top:8px" onclick="delInfo('${k}',${n})">Hapus</button>`:""}</div>`).join("")
  :"<div class='empty'>Belum ada informasi.</div>"}</div>`);
}
function addInfo(k){
 if(role!=="admin" && role!==k){alert("Hanya Admin atau bidang terkait yang dapat menambah informasi.");return}
 const j=document.getElementById("judul").value.trim(),i=document.getElementById("isi").value.trim();
 if(!j){alert("Judul informasi wajib diisi.");return}
 if(!data.informasi[k])data.informasi[k]=[];
 data.informasi[k].unshift({judul:j,isi:i,tanggal:new Date().toLocaleDateString("id-ID")});
 save();renderGeneric(k);refreshDashboard();
}
function delInfo(k,n){
  if(!canEdit(k)){alert("Hanya Admin atau bidang terkait yang dapat menghapus informasi.");return}
  if(!confirm("Hapus informasi ini?"))return;
 data.informasi[k].splice(n,1);save();renderGeneric(k);refreshDashboard();
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}

function renderJadwal(){
 const can=role==="admin" || role==="sekretaris";
 const now=new Date(); now.setHours(0,0,0,0);
 const upcoming=data.jadwal
  .map((x,index)=>({x,index}))
  .filter(o=>o.x.tanggal&&new Date(o.x.tanggal+"T00:00:00")>=now)
  .sort((a,b)=>a.x.tanggal.localeCompare(b.x.tanggal))
  .slice(0,3);

 const notice=upcoming.length?`<div class="notice"><b><span class="inline-icon">${icon("bell")}</span> Jadwal terdekat</b>
  ${upcoming.map(o=>`<div style="margin-top:8px;padding-bottom:8px;border-bottom:1px solid rgba(0,0,0,.06)">
    <b>${escapeHtml(o.x.judul)}</b><br>
    <span class="muted">${escapeHtml(o.x.tanggal||"-")} · ${escapeHtml(o.x.petugas||"-")}</span>
    ${can?`<br><button class="btn danger" style="margin-top:7px;display:inline-block;position:relative;touch-action:manipulation;pointer-events:auto" type="button" onclick="return hapusJadwalTombol(${o.index})">Hapus</button>`:""}
  </div>`).join("")}
 </div>`:"";

 title("Jadwal & Notifikasi",`${can?`<h3>Tambah jadwal</h3>
  <select id="jenis"><option>Gema Al-Qur'an</option><option>Iftifal Usbui</option><option>Presentasi Buku</option><option>Kultum</option><option>Kegiatan Lainnya</option></select>
  <input id="judul" placeholder="Nama kegiatan / nama terjadwal">
  <input id="tanggal" type="date">
  <input id="petugas" placeholder="Petugas / nama">
  <input id="tema" placeholder="Tema (opsional)">
  <button class="btn" onclick="addJadwal()">Tambah Jadwal</button>`
  :"<p class='muted'>Santri dapat melihat jadwal dan notifikasi, tetapi tidak dapat mengubahnya.</p>"}
  ${notice}<h3 style="margin-top:18px">Daftar jadwal</h3>
  ${data.jadwal.length?data.jadwal.map((x,n)=>`<div class="item"><span class="badge">${escapeHtml(x.jenis||"Kegiatan")}</span><br><b>${escapeHtml(x.judul)}</b><br>
  <span class="muted">${escapeHtml(x.tanggal||"-")} · ${escapeHtml(x.petugas||"-")}${x.tema?" · Tema: "+escapeHtml(x.tema):""}</span>
  ${can?`<button class="btn danger" style="margin-top:8px;display:inline-block;position:relative;touch-action:manipulation;pointer-events:auto" type="button" onclick="return hapusJadwalTombol(${n})">Hapus</button>`:""}</div>`).join("")
  :"<div class='empty'>Belum ada jadwal.</div>"}`);
}
function addJadwal(){
 if(role!=="admin" && role!=="sekretaris"){alert("Hanya Admin atau Sekretaris yang dapat menambah jadwal.");return}
 const j=document.getElementById("judul").value.trim(),t=document.getElementById("tanggal").value,p=document.getElementById("petugas").value.trim(),jenis=document.getElementById("jenis").value,tema=document.getElementById("tema").value.trim();
 if(!j||!t){alert("Nama kegiatan dan tanggal wajib diisi.");return}
 data.jadwal.push({judul:j,tanggal:t,petugas:p,bidang:role,jenis,tema});
 save();renderJadwal();refreshDashboard();
}
function hapusJadwalTombol(n){
  try{
    delJadwal(Number(n));
  }catch(err){
    alert("Terjadi kesalahan saat menghapus jadwal.");
    console.error(err);
  }
  return false;
}

function delJadwal(n){
  if(role!=="admin" && role!=="sekretaris"){
    alert("Hanya Admin atau Sekretaris yang dapat menghapus jadwal.");
    return;
  }
  n = Number(n);
  if(!Number.isInteger(n) || n < 0 || n >= data.jadwal.length){
    alert("Jadwal tidak ditemukan.");
    return;
  }
  if(!confirm("Hapus jadwal ini? Notifikasi jadwal tersebut juga akan ikut dihapus.")) return;
  data.jadwal.splice(n, 1);
  save();
  renderJadwal();
  refreshDashboard();
}

let mediaUrls=[];
async function renderDok(){
  const can=role==="admin" || role==="sekretaris";
  const token=++navToken;
  mediaCache=await getMedia();
  if(token!==navToken) return;
  mediaUrls.forEach(u=>URL.revokeObjectURL(u));mediaUrls=[];
 const cards=mediaCache.length?mediaCache.map(x=>{
  const url=URL.createObjectURL(x.blob);mediaUrls.push(url);
  const isVideo=String(x.type||"").startsWith("video/");
  return `<div class="media-card">
   ${isVideo?`<video src="${url}" controls preload="metadata"></video>`:`<img src="${url}" alt="${escapeHtml(x.name)}">`}
   <div class="media-meta">
    <b>${escapeHtml(x.name)}</b><small>${escapeHtml(x.date)} · ${isVideo?"Video":"Foto"}</small>
    ${can?`<button class="btn danger" style="margin-top:7px;width:100%" onclick="removeMedia(${x.id})">Hapus</button>`:""}
   </div>
  </div>`;
 }).join(""):"<p class='muted'>Belum ada foto/video yang diarsipkan.</p>";

 title("Dokumentasi Kegiatan",`${can?`<div class="filebox">
   <b><span class="inline-icon">${icon("upload")}</span> Tambah foto / video</b>
   <p class="muted">Pilih file langsung dari galeri atau pengelola file HP.</p>
   <input id="mediaFiles" type="file" accept="image/*,video/*" multiple>
   <button class="btn" onclick="uploadMedia()">Simpan ke Arsip</button>
  </div>`:"<p class='muted'>Santri hanya dapat melihat dokumentasi. Admin/Sekretaris dapat menambahkan foto/video dari HP.</p>"}
  <h3 style="margin-top:18px">Arsip Foto & Video</h3>
  <div class="media-grid">${cards}</div>`);
}
async function uploadMedia(){
 if(role!=="admin" && role!=="sekretaris"){alert("Hanya Admin atau Sekretaris yang dapat menambah dokumentasi.");return}
 const input=document.getElementById("mediaFiles");
 if(!input || !input.files.length){alert("Pilih foto atau video terlebih dahulu.");return}
  try{
   for(const file of Array.from(input.files).slice(0,20)){
    if(file.type.startsWith("image/")||file.type.startsWith("video/")) await addMediaFile(file);
   }
  }catch(e){
   console.error(e);
   alert("Foto/video gagal disimpan. Coba buka file ini lewat browser (bukan dari dalam WhatsApp) atau kosongkan ruang penyimpanan.");
  }
  await renderDok();refreshDashboard();
}
async function removeMedia(id){
  if(role!=="admin" && role!=="sekretaris"){alert("Hanya Admin atau Sekretaris yang dapat menghapus dokumentasi.");return}
  if(!confirm("Hapus foto/video ini?"))return;
  try{ await deleteMedia(id); }catch(e){ console.error(e); alert("Gagal menghapus file."); }
  await renderDok();refreshDashboard();
}

function renderKeuangan(){
 const can=role==="admin" || role==="bendahara";
 const rows=data.keuangan.map((x,n)=>`<tr><td>${escapeHtml(x.tanggal)}</td><td>${x.jenis==="masuk"?"Pemasukan":"Pengeluaran"}</td>
  <td>${rupiah(+x.nominal)}</td><td>${escapeHtml(x.ket||"")}</td>
  ${can?`<td><button class="btn danger" onclick="delKeu(${n})">×</button></td>`:""}</tr>`).join("");
 title("Bendahara",`${can?`<h3>Input transaksi</h3>
  <select id="jenis"><option value="masuk">Pemasukan</option><option value="keluar">Pengeluaran</option></select>
  <input id="nominal" type="number" min="1" placeholder="Nominal">
  <input id="ket" placeholder="Keterangan">
  <button class="btn" onclick="addKeu()">Simpan transaksi</button>`
  :"<p class='muted'>Santri hanya dapat melihat informasi keuangan. Input transaksi hanya untuk Bendahara/Admin.</p>"}
  <h3 style="margin-top:18px">Laporan keuangan</h3>
  <div style="overflow:auto"><table class="table"><tr><th>Tanggal</th><th>Jenis</th><th>Nominal</th><th>Keterangan</th>${can?"<th></th>":""}</tr>
  ${rows||"<tr><td colspan='5'>Belum ada transaksi.</td></tr>"}</table></div>`);
}
function addKeu(){
 if(role!=="admin" && role!=="bendahara"){alert("Hanya Admin atau Bendahara yang dapat menambah transaksi.");return}
 const n=Number(document.getElementById("nominal").value);
 if(!Number.isFinite(n)||n<=0){alert("Nominal harus lebih dari 0.");return}
 data.keuangan.push({jenis:document.getElementById("jenis").value,nominal:n,ket:document.getElementById("ket").value.trim(),tanggal:new Date().toLocaleDateString("id-ID")});
 save();renderKeuangan();refreshDashboard();
}
function delKeu(n){
  if(role!=="admin" && role!=="bendahara"){alert("Hanya Admin atau Bendahara yang dapat menghapus transaksi.");return}
  if(!confirm("Hapus transaksi ini?"))return;
  data.keuangan.splice(n,1);save();renderKeuangan();refreshDashboard();
}

function renderSekretaris(){
 const can=role==="admin"||role==="sekretaris";
 const rows=data.administrasi;
 title("Sekretaris",`${can?`<h3>Tambah arsip administrasi</h3>
  <select id="katAdmin"><option>Surat Masuk</option><option>Surat Keluar</option><option>LPJ</option><option>Agenda RG-UG</option><option>Program Kerja</option><option>Data Pengurus</option><option>Database Anggota</option><option>Kegiatan</option></select>
  <input id="judulAdmin" placeholder="Nomor / judul dokumen atau kegiatan">
  <textarea id="isiAdmin" placeholder="Keterangan / isi arsip"></textarea>
  <button class="btn" onclick="addAdmin()">Simpan Arsip</button>`
  :"<p class='muted'>Hanya Sekretaris/Admin yang dapat menambah atau menghapus arsip.</p>"}
  <p class="muted" style="margin-top:18px">Arsip surat, LPJ, agenda, program kerja, data pengurus, database anggota, dan kegiatan.</p>
  <h3>Arsip Administrasi</h3>
  ${rows.length?rows.map((x,n)=>`<div class="item"><span class="badge">${escapeHtml(x.kategori)}</span><br><b>${escapeHtml(x.judul)}</b><div>${escapeHtml(x.isi||"").replace(/\r?\n/g,"<br>")}</div><span class="muted">${escapeHtml(x.tanggal)}</span>${can?`<button class="btn danger" style="margin-top:8px" onclick="delAdmin(${n})">Hapus</button>`:""}</div>`).join(""):"<div class='empty'>Belum ada arsip administrasi.</div>"}`);
}
function addAdmin(){
 if(role!=="admin" && role!=="sekretaris"){alert("Hanya Admin atau Sekretaris yang dapat menambah arsip.");return}
 const kategori=document.getElementById("katAdmin").value,j=document.getElementById("judulAdmin").value.trim(),i=document.getElementById("isiAdmin").value.trim();
 if(!j){alert("Nomor atau judul wajib diisi.");return}
 data.administrasi.unshift({kategori,judul:j,isi:i,tanggal:new Date().toLocaleDateString("id-ID")});
 save();renderSekretaris();
}
function delAdmin(n){
  if(role!=="admin" && role!=="sekretaris"){alert("Hanya Admin atau Sekretaris yang dapat menghapus arsip.");return}
  if(!confirm("Hapus arsip ini?"))return;
 data.administrasi.splice(n,1);save();renderSekretaris();
}
